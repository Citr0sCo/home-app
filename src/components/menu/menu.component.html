<div class="menu-component">
  @if (showMenu) {
    <div class="menu-component--menu">
      <ul>
        <li>
          <a [routerLink]="['/', 'home']" [routerLinkActive]="'active'" (click)="showMenu = !showMenu"><i class="fa fa-home"></i> Home</a>
        </li>
        <li>
          <a [routerLink]="['/', 'fuel-prices']" [routerLinkActive]="'active'" (click)="showMenu = !showMenu"><i class="fa fa-credit-card"></i> Fuel Prices</a>
        </li>
        <li>
          <a [routerLink]="['/', 'update-docker-apps']" [routerLinkActive]="'active'" (click)="showMenu = !showMenu"><i class="fas fa-cloud-download-alt"></i> Update Apps</a>
        </li>
          <li>
              <a [routerLink]="['/', 'notepad']" [routerLinkActive]="'active'" (click)="showMenu = !showMenu"><i class="fas fa-book-open"></i> Notepad</a>
          </li>
        <li>
          <a [routerLink]="['/', 'server-stats']" [routerLinkActive]="'active'" (click)="showMenu = !showMenu"><i class="fas fa-chart-line"></i> Server Stats</a>
        </li>
        <li>
          <a [routerLink]="['/', 'settings']" [routerLinkActive]="'active'" (click)="showMenu = !showMenu"><i class="fas fa-cog"></i> Settings</a>
        </li>
      </ul>
    </div>
  }
  <div class="menu-component--action-button" (click)="showMenu = !showMenu">
    <i class="fa fa-bars"></i>
  </div>
</div>
