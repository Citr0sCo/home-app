name: Build

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

env:
  CHROME_BIN: /usr/bin/chromium-browser

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  build-fe:
    runs-on: self-hosted
    container:
      image: node:22
    steps:
      - uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Build FE
        run: npm run build


  test-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Install Chromium
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium

      - name: Run tests with coverage
        run: |
          export CHROME_BIN="$(command -v chromium)"
          npm run test-ci

      - name: Check coverage files exist
        run: |
          ls -la coverage/home-box-landing/
          if [ -f "coverage/home-box-landing/lcov.info" ]; then
            echo "lcov.info found"
          else
            echo "ERROR: coverage/home-box-landing/lcov.info not found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/home-box-landing/lcov.info
          flags: unittests
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Store coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/home-box-landing/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Check coverage files exist
        run: |
          ls -la coverage/home-box-landing/
          if [ -f "coverage/home-box-landing/lcov.info" ]; then
            echo "lcov.info found"
          else
            echo "ERROR: lcov.info not found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/home-box-landing/lcov.info
          flags: unittests
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}


  lint-fe:
    runs-on: self-hosted
    container:
      image: node:22
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      # - name: Lint FE
      #   run: npm run lint


  build-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore api/home-box-landing/HomeBoxLanding.sln

      - name: Build BE
        run: dotnet build api/home-box-landing/HomeBoxLanding.sln --no-restore


  test-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore api/home-box-landing/HomeBoxLanding.sln

      - name: Test BE
        run: dotnet test api/home-box-landing/HomeBoxLanding.sln

  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t home-app . --platform linux/amd64
