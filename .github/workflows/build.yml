name: Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  merge_group:
    types:
      - checks_requested

env:
  CHROME_BIN: /usr/bin/chromium

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Build frontend
        run: npm run build

  test-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Install Chromium
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium
          rm -rf /var/lib/apt/lists/*

      - name: Run frontend tests with coverage
        run: |
          export CHROME_BIN="$(command -v chromium)"
          npm run test-ci

      - name: Check coverage report
        run: |
          test -f coverage/home-box-landing/lcov.info
          ls -lh coverage/home-box-landing/lcov.info

      - name: Store coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload frontend coverage to Codecov
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/home-box-landing/lcov.info
          flags: frontend
          fail_ci_if_error: true
          verbose: true

  lint-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      # Re-enable once the lint configuration is working.
      # - name: Lint frontend
      #   run: npm run lint

  build-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore backend
        run: dotnet restore api/home-box-landing/HomeBoxLanding.sln

      - name: Build backend
        run: >
          dotnet build
          api/home-box-landing/HomeBoxLanding.sln
          --no-restore
          --configuration Release

  test-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore backend
        run: dotnet restore api/home-box-landing/HomeBoxLanding.sln

      - name: Test backend
        run: >
          dotnet test
          api/home-box-landing/HomeBoxLanding.sln
          --no-restore
          --configuration Release

  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t home-app .
