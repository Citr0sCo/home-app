name: Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  merge_group:
    types:
      - checks_requested

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v5

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/yarn
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Build frontend
        run: npm run build

  test-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Test FE
        run: npm run test-ci

      - name: Check coverage files exist
        run: |
          if [ -f "coverage/home-box-landing/lcov.info" ]; then
            echo "lcov.info found"
          else
            echo "ERROR: lcov.info not found"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage/home-box-landing/lcov.info
          flags: unittests
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}


  lint-fe:
    runs-on: self-hosted
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: yarn --frozen-lockfile --prefer-offline

      - name: Lint FE
        run: npm run lint

  build-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - uses: actions/checkout@v5

      - name: Restore backend
        run: dotnet restore api/home-box-landing/HomeBoxLanding.sln

      - name: Build backend
        run: >
          dotnet build
          api/home-box-landing/HomeBoxLanding.sln
          --no-restore
          --configuration Release

  test-be:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - uses: actions/checkout@v5

      - name: Restore backend
        run: dotnet restore api/home-box-landing/HomeBoxLanding.sln

      - name: Test backend
        run: >
          dotnet test
          api/home-box-landing/HomeBoxLanding.sln
          --no-restore
          --configuration Release

  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t home-app .
